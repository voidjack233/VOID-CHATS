map $http_upgrade $void_connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $void_frontend http://frontend:5173;
    set $void_account_service http://api:3001;
    set $void_message_service http://message-api:3002;
    set $void_social_service http://social-api:3004;
    set $void_conversation_service http://conversation-api:3005;
    set $void_gateway_service http://gateway:4001;
    set $void_minio_public http://minio:9000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;

    location = /health {
        proxy_pass $void_account_service;
    }

    location = /ready {
        proxy_pass $void_account_service;
    }

    location ^~ /gateway {
        proxy_pass $void_gateway_service;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $void_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location ^~ /api/auth {
        proxy_pass $void_account_service;
    }

    location ^~ /api/me {
        proxy_pass $void_account_service;
    }

    location ^~ /api/csrf {
        proxy_pass $void_account_service;
    }

    location ^~ /api/captcha {
        proxy_pass $void_account_service;
    }

    location ^~ /api/debug {
        proxy_pass $void_account_service;
    }

    location ^~ /api/clear-stale {
        proxy_pass $void_account_service;
    }

    location ^~ /api/link-preview {
        proxy_pass $void_account_service;
    }

    location = /api/users/account {
        proxy_pass $void_account_service;
    }

    location ^~ /api/users/sessions {
        proxy_pass $void_account_service;
    }

    location ^~ /api/users/preferences {
        proxy_pass $void_account_service;
    }

    location ^~ /api/users/search {
        proxy_pass $void_social_service;
    }

    location ^~ /api/users {
        proxy_pass $void_social_service;
    }

    location ^~ /api/friends {
        proxy_pass $void_social_service;
    }

    location ~ ^/api/conversations/[^/]+/(messages|attachments|reactions)(/|$) {
        proxy_pass $void_message_service;
    }

    location = /api/bootstrap {
        proxy_pass $void_conversation_service;
    }

    location /api/conversations {
        proxy_pass $void_conversation_service;
    }

    location ^~ /avatars/ {
        proxy_pass $void_minio_public;
    }

    location ^~ /group-avatars/ {
        proxy_pass $void_minio_public;
    }

    location / {
        proxy_pass $void_frontend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $void_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
