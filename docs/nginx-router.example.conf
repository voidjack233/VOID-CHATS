map $http_upgrade $void_connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name www.your-domain.example;

    return 301 http://your-domain.example$request_uri;
}

server {
    listen 80;
    server_name your-domain.example;

    root /var/www/your-frontend-build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

server {
    listen 80;
    server_name api.your-domain.example;

    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;

    location ^~ /gateway {
        proxy_pass http://127.0.0.1:4001;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $void_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location ^~ /api/auth {
        proxy_pass http://127.0.0.1:3001;
    }

    location ^~ /api/me {
        proxy_pass http://127.0.0.1:3001;
    }

    location ^~ /api/csrf {
        proxy_pass http://127.0.0.1:3001;
    }

    location ^~ /api/captcha {
        proxy_pass http://127.0.0.1:3001;
    }

    location ^~ /api/debug {
        proxy_pass http://127.0.0.1:3001;
    }

    location ^~ /api/clear-stale {
        proxy_pass http://127.0.0.1:3001;
    }

    location ^~ /api/link-preview {
        proxy_pass http://127.0.0.1:3001;
    }

    location = /api/users/account {
        proxy_pass http://127.0.0.1:3001;
    }

    location ^~ /api/users/sessions {
        proxy_pass http://127.0.0.1:3001;
    }

    location ^~ /api/users/preferences {
        proxy_pass http://127.0.0.1:3001;
    }

    location ^~ /api/users/search {
        proxy_pass http://127.0.0.1:3004;
    }

    location ^~ /api/users {
        proxy_pass http://127.0.0.1:3004;
    }

    location ^~ /api/friends {
        proxy_pass http://127.0.0.1:3004;
    }

    location ~ ^/api/conversations/[^/]+/(messages|attachments|reactions)(/|$) {
        proxy_pass http://127.0.0.1:3002;
    }

    location = /api/bootstrap {
        proxy_pass http://127.0.0.1:3005;
    }

    location /api/conversations {
        proxy_pass http://127.0.0.1:3005;
    }
}

server {
    listen 80;
    server_name cdn.your-domain.example;

    location ^~ /avatars/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /group-avatars/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
